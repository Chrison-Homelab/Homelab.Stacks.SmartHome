name: validate

# Opt-in shape validation (ADR-0008, Phase 0 D2). Calls the reusable validator
# in the Homelab superproject, which downloads the pinned portable validator
# (schema-v1 release) and runs the C# engine `validate` over this repo's shapes
# on ubuntu-latest — no .NET SDK / private feeds / self-hosted runner.
#
# Requires the org/repo secret SCHEMA_RO_PAT — a fine-grained PAT with
# contents:read on Chrison-dev/Homelab (to download the release asset). Until
# it's set, this check fails at the download step.

on:
  pull_request: {}
  workflow_dispatch: {}

jobs:
  shapes:
    uses: Chrison-dev/Homelab/.github/workflows/_validate-shapes.yml@main
    secrets:
      schema_token: ${{ secrets.SCHEMA_RO_PAT }}
