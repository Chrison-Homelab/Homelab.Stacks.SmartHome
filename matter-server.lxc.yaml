# Matter Server — the Matter/Thread controller, extracted from Home Assistant.
#
# Was the HAOS "Matter Server" add-on; now a standalone member. It runs the same
# upstream image the add-on wraps: ghcr.io/home-assistant-libs/python-matter-server.
# HA connects over WebSocket: Settings → Devices & Services → Matter → ws://<ip>:5580/ws.
#
# WHY DOCKER-HOST (not the community-scripts native app): community-scripts DISABLED
# ct/matter-server.sh server-side (python-matter-server was archived 2026-06-23,
# "re-enabled when migrated to Matter.js"). The prebuilt image still ships and is
# what the add-on uses, so we run it directly — thin Docker host (app: docker →
# ct/docker.sh) + our compose (matter-server/compose.yml), same pattern as Leapmotor.
#
# ⚠️ IPv6 REQUIRED. Matter devices talk over IPv6 (link-local + mDNS), so this CT
# has IPv6 on the IoT VLAN (network override below, ipv6: auto / SLAAC), and the
# container runs network_mode: host so that reaches the device L2. If commissioning
# fails, confirm VLAN 1040 sends Router Advertisements (IPv6 enabled in UniFi).
#
# mDNS: discovery is multicast on the device L2 → CT on VLAN 1040 (IoT), same
# segment as the Matter devices (confirmed 2026-07-17). No inter-VLAN boundary.
#
# STATE: fabric credentials live in ./data (CT-local). Migrating the add-on's
# fabric (to keep devices paired) = copy its matter storage into ./data — see
# README ("Matter fabric migration"). Fresh start = re-commission the devices.
#
# ✅ HA ACTUALLY POINTS HERE AS OF 2026-08-02 (#250). Until then it did not: HA's
# Matter config entry still read `ws://core-matter-server:5580/ws` — the add-on
# INSIDE HAOS — and this CT sat running with ZERO established connections on :5580.
# The extraction had been written up as done but never took effect, which would have
# silently lost Matter on any HA container migration. Now `ws://10.40.62.181:5580/ws`,
# verified by two established sessions from HA's IoT leg (10.40.0.20).
#
# No fabric migration was needed — both sides were empty (0 commissioned nodes, 0
# Matter entities in HA), so this was a clean repoint rather than the copy-the-storage
# dance above. That option still stands if devices are ever commissioned to the wrong one.
#
# ⚠️ The redundant add-on `app_core_matter_server` is STILL RUNNING inside HAOS and is
# now unused. Leaving two Matter servers alive is exactly how the mix-up above happened;
# it should be uninstalled once this has been trusted for a bit.
#
# EXPOSURE — INTERNAL-ONLY. Only HA (the WS client) talks to it. No tunnel.
# Validate against ../../Infrastructure/schema/shape.schema.json.

apiVersion: homelab/v1
kind: LXC

metadata:
  name: matter-server
  stack: SmartHome
  tags: [smart-home, iot, matter, thread, docker]

spec:
  app: docker            # community-scripts slug → ct/docker.sh (Docker Engine host)
  ctid: 6001
  cores: 2               # moderately busy during commissioning
  memory: 2048           # MB
  disk: 8                # GB — Docker image layers + a small fabric store

  features:
    nesting: true        # Docker-in-LXC
    keyctl: true         # containerd keyring on unprivileged LXC

  # Override the stack default network to ADD IPv6 (Matter requirement). Same
  # bridge/VLAN as the stack (IoT 1040), DHCP v4, SLAAC v6.
  network:
    bridge: vmbr0
    vlan: 1040
    ipv4: dhcp
    ipv6: auto           # SLAAC — Matter needs IPv6 to the devices on this L2
