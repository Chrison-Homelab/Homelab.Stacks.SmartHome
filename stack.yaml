# SmartHome stack — the home-automation / IoT support layer.
#
# Home Assistant IS a member of this stack as of 2026-08-09 — CT 6005, HA Container
# (see homeassistant.lxc.yaml). The hand-built HAOS VM 2000 it replaced is retired and
# stopped, kept only as a rollback. Alongside HA this stack carries the *supporting
# infrastructure* that feeds it: an MQTT broker,
# with room to grow (zigbee2mqtt, node-red, esphome, zwave-js-ui, frigate, …) as
# the need arises — each a new member dropped into this same stack + broker.
#
# Members:
#   - mqtt (Mosquitto) — CT 6000, native community-scripts install (ct/mqtt.sh).
#     The broker Leapmotor Mate publishes to and Home Assistant subscribes to.
#   - leapmotor-mate — CT 4100, Docker host (ct/docker.sh + our compose). The
#     Leapmotor C10 companion; publishes state + HA-discovery to the mqtt broker
#     above. ADOPTED IN-PLACE / out-of-block: it's live at 4100 (outside 6000–6099)
#     and kept there to avoid a redeploy — a documented exception like the HA VM.
#   - homeassistant — CT 6005, the hub (see homeassistant.lxc.yaml). HA Container
#     via community-scripts; dual-homed Homelab 1010 (primary) + IoT 1040 leg.
#   - homeassistant — VMID 2000, RETIRED (see homeassistant.vm.yaml). The old HAOS
#     VM this stack used to merely feed. Stopped, onboot false, manage: retired;
#     kept only as a rollback. NEVER run it alongside CT 6005 — they share the
#     broker, the Matter server and the Zigbee coordinator.
#
# EXPOSURE — INTERNAL-ONLY. MQTT is never exposed publicly. The broker lives on
# the IoT VLAN (1040). HA (CT 6005) reaches it at LAYER 2 over its IoT leg — no
# gateway, no firewall zone crossed — which is why `Homelab -> IOT` can stay BLOCK.
#
# Deployed via the Fallout pipeline → engine converge (../../Infrastructure).
# Validate members against ../../Infrastructure/schema/shape.schema.json.
#
# CTID allocation policy: LXC members set ctid EXPLICITLY within the block below.
# The retired HA VM (2000) is the documented exception (legacy number, manage: retired).

apiVersion: homelab/v1
kind: Stack

metadata:
  name: SmartHome
  tags: [smart-home, iot, home-automation]

spec:
  ctidRange:
    start: 6000           # fresh block — 1xxx/2xxx/3xxx/4xxx/51xx were taken.
    end: 6099             # governs newly-allocated LXC members; the adopted out-of-block members
                          # (HA VM 2000, leapmotor-mate CT 4100) sit outside this range by design.
  defaults:
    node: hpe-01          # co-located with Home Assistant (VM 2000) + Leapmotor (CT 4100).
    source:
      channel: stable     # → community-scripts/ProxmoxVE (ct/mqtt.sh → Mosquitto)
      ref: main
    os: debian
    osVersion: 13
    unprivileged: true
    storage: local-lvm
    templateStorage: local
    onboot: true
    network:
      bridge: vmbr0
      vlan: 1040          # IoT VLAN — real tag → interface name=vlan1040,tag=1040
      ipv4: dhcp          # DHCP-reserved post-deploy so clients get a stable broker address.
      ipv6: none
    timezone: Pacific/Auckland
    tags: [smart-home, iot, community-script]
