# Home Assistant — ADOPTS the existing hand-built HAOS VM (VMID 2000).
#
# ⚠️ ADOPT / DESCRIBE-ONLY — DO NOT converge --apply this VM. ⚠️
# This shape exists so the SmartHome stack is reproducible (a from-scratch
# redeploy is documented + version-controlled), NOT so the engine routinely
# reconciles a live, stateful smart-home box. HA predates the stack and its
# number (2000) sits far from the 6000 LXC block — it's the documented
# out-of-range adopted member (see stack.yaml), mirroring Gaming's adopted VMs.
#
# Two reasons apply is intentionally not wired yet:
#   1. HA has THREE NICs (below), expressed via `networks[]`. VmConverger only
#      reconciles the single-NIC `network` sugar today, so `networks[]` is purely
#      descriptive — an apply would make NO NIC changes (leaves net0/1/2 as-is).
#      Faithful documentation now; real multi-NIC converge lands with the engine.
#   2. There is no `managed:false` flag in the schema yet, so this file IS a
#      converge member — a `Deploy --stack SmartHome` WOULD include it. Until an
#      exclude flag lands, deploy the broker with `--stack` targeting is fine but
#      DO NOT apply this VM. `Preview` is read-only and safe.
#
# REDEPLOY-FROM-SCRATCH SEAM: HAOS ships as a disk image, not a package. To
# rebuild elsewhere: seed the VM with community-scripts `vm/haos-vm.sh` (downloads
# + imports the HAOS qcow2), then this shape documents the sizing/firmware to match.
# HA's own config/state restores from an HA backup — not from this shape.
#
# Live spec captured from `qm config 2000` on 2026-07-12.

apiVersion: homelab/v1
kind: VM

metadata:
  name: homeassistant
  stack: SmartHome
  tags: [smart-home, home-assistant, haos, adopted]
  description: >-
    Home Assistant OS VM — the smart-home hub. Subscribes to the SmartHome MQTT
    broker (CT 6000) and auto-discovers devices (e.g. the Leapmotor C10 via Mate).

spec:
  node: hpe-01
  vmid: 2000              # ADOPTED — existing homeassistant VM; do not allocate fresh.
  name: homeassistant

  # NEVER WRITTEN BY CONVERGE — enforced, not merely documented (#325).
  #
  # This file describes a hand-built HAOS install that predates the stack, so its live
  # config can never fully match the shape. Without this marker converge read that
  # difference as drift on every single run, and an unscoped `--apply` proposed a
  # `SetConfig` against it. The README and stack.yaml have always said "describe-only",
  # but that was prose: the only thing actually preventing a write was the operator
  # remembering to pass `--only`. Now the plan reports DESCRIBE-ONLY instead of drift and
  # apply reports SKIPPED — and naming it in `--only` does not override either. (Destroy
  # was never a risk for this member: `converge --destroy` is CT-scoped and does not touch
  # VM members at all. The same marker DOES make destroy refuse a describe-only LXC.)
  # Everything below stays descriptive — it documents reality.
  # RETIRED 2026-08-09 — superseded by homeassistant.lxc.yaml (CT 6005).
  #
  # `retired`, not `describe-only`: describe-only meant "adopted, documented, never written".
  # This VM is now SUPERSEDED, and the distinction matters — `retired` makes converge refuse to
  # recreate it even if someone names it in `--only`, which is exactly how CT 5113 came back
  # months after it was retired (Homelab#362). A tag and a comment are not read by the engine.
  #
  # STOPPED, NOT DESTROYED. This is the rollback: if the container instance turns out to be
  # missing something, `qm start 2000` brings the old house back. Destroy is deliberately a
  # separate, later decision (#21) and needs a snapshot first — stopping does not, because it
  # is reversible.
  #
  # ⚠️ DO NOT START IT ALONGSIDE CT 6005. Both instances talk to the same MQTT broker, the same
  # Matter server and the same Zigbee coordinator. Two live Home Assistants sharing that
  # infrastructure is what hid the duplicate Matter server for months.
  manage: retired

  machine: q35
  bios: ovmf              # UEFI (pairs with the efidisk below)
  cores: 2
  memory: 2048            # MB
  ostype: l26
  agent: true             # QEMU guest agent enabled
  onboot: false          # retired — must not come back on a host reboot

  disks:
    - id: scsi0
      storage: local-lvm
      source: vm-2000-disk-0   # existing HAOS system disk (adopted)
      size: 32                 # GB
      ssd: true
      discard: true
  efidisk:
    storage: local-lvm
    source: vm-2000-disk-1      # existing efidisk (adopted)
    efitype: 4m

  # All THREE NICs, faithfully (array index → netN, model virtio). Only net0 is
  # up; net1/net2 are provisioned but administratively DOWN (Proxmox link_down).
  # NOTE: converge maps only the single-NIC `network` sugar today — `networks[]`
  # is descriptive (not reconciled), which is exactly right for this describe-only
  # adopted VM. It documents reality without the engine trying to manage the NICs.
  # TRI-HOMED as of 2026-08-02 (#339). net1 and net2 were provisioned-but-link_down for
  # exactly this; they are now up, each on a DHCP reservation.
  #
  # The point of the split: HA reaches every IoT device over net1 at LAYER 2 — same subnet,
  # no gateway, no firewall zone crossed — while everything reaches HA over net2 on the
  # Homelab VLAN. That is what makes full IoT isolation possible: the `Homelab -> IOT` zone
  # pair is BLOCK (only a predefined return rule), so a single-homed HA on 1010 would have
  # needed a new allow-all rule punched through. Tri-homing needs no firewall change at all.
  #
  # net1 carries NO DEFAULT ROUTE (`nmcli con mod "Supervisor enp6s19" ipv4.never-default
  # yes`) — it is device-facing only. Without that it is luck: NetworkManager happened to
  # assign it metric 20102, but a reconnect could recompute.
  # All three reservations are PARKED (superproject #416). This VM is `manage: retired` and
  # kept only as the CT 6005 rollback, so its addresses must stay held — but converge must
  # never write them either. `parked:` says exactly that, and stops the audit reporting them
  # as orphans, which is otherwise indistinguishable from a reservation whose guest is gone.
  # (On a kind: VM shape a reservation is audit-only regardless; declaring them here is about
  # recording intent, not about converge acting on it.)
  networks:
    - bridge: vmbr0                     # net0 — untagged/native → guest enp6s18
      hwaddr: "02:1F:98:8B:6F:6A"       #        legacy 192.168.179.102 — default route, metric 100.
                                        #        STILL PRIMARY; retiring it is the rest of #339 (see below).
      reservation:
        fixedIp: 192.168.179.102
        parked: "VM 2000 is the CT 6005 rollback (#250); legacy-VLAN address held until #339 retires net0"
    - bridge: vmbr0                     # net1 — IoT VLAN → guest enp6s19
      hwaddr: "BC:24:11:C0:7F:BB"       #        10.40.0.20. L2 path to the Zigbee gateway
      tag: 1040                         #        (10.40.0.21), Mosquitto (10.40.26.247) and Matter (10.40.62.181).
      firewall: true                    #        never-default: no default route via this leg.
      reservation:
        fixedIp: 10.40.0.20
        parked: "VM 2000 is the CT 6005 rollback (#250) — CT 6005's IoT leg is 10.40.0.22"
    - bridge: vmbr0                     # net2 — Homelab VLAN → guest enp6s20
      hwaddr: "BC:24:11:3C:03:54"       #        10.10.0.20. Default route metric 101.
      tag: 1010                         #        Pangolin reaches HA here once net0 goes.
      firewall: true
      reservation:
        fixedIp: 10.10.0.20
        parked: "VM 2000 is the CT 6005 rollback (#250) — CT 6005's Homelab leg is 10.10.0.21"
  # ⚠ RETIRING net0 (the remainder of #339) is NOT just deleting the NIC:
  #   1. net0 currently holds the metric-100 default route. enp6s20 must become primary
  #      first, or HA loses egress.
  #   2. Only then can the custom `Internal -> IOT` allow be reconsidered, which is what
  #      "fully isolate IoT" actually requires.
  #
  # CORRECTED 2026-08-16: this used to warn that `homeassistant.homelab.chrison.internal`
  # was "attached to a reservation keyed on net0's MAC (02:1F:98:8B:6F:6A)" and that
  # re-keying it would break the Pangolin resource. Checked against the live controller:
  # it is a UniFi STATIC-DNS A record pointing straight at 10.10.0.21 — CT 6005 — not a
  # per-client record on this VM at all, and net0's reservation carries no DNS name. So
  # retiring net0 does not touch that name. (CT 6005's own reservation separately carries
  # `homeassistant.iot.chrison.internal`; both names resolve to 10.10.0.21 today.) The
  # static-DNS records are still hand-made and undeclared — superproject #314.

  tags: [hpe-01, smart-home, vlan-1010, vlan-1040]   # preserve the existing Proxmox tags
